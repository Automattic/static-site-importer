name: Refresh dependencies and release

# SSI owns its own dependency freshness. It never receives a notification from
# Blocks Engine (no repository_dispatch, no cross-repo token, no Homeboy App
# installation on this repository) — it resolves the newest released Blocks
# Engine coordinates itself, on every push, once a day on a schedule, and on
# demand. A dependency refresh with no other change is itself a releasable
# commit, so a newer upstream release ships even when nobody touched SSI.
on:
  push:
    branches: [main]
  schedule:
    # Daily at 06:17 UTC. Off-the-hour minute avoids the top-of-hour scheduler
    # thundering herd; cadence is intentionally coarse — a missed day is
    # picked up by the next push or the next scheduled run.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview dependency refresh and release without writes
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: static-site-importer-release-main
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh published Blocks Engine pins
    # A release commit pushed back to main by the `release` job below must
    # never retrigger this workflow against its own output — that is the
    # infinite-loop path. Mirrors the same guard the reusable release
    # workflow applies to its own push trigger.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      # Homeboy CLI acquisition is left at the composite action's default
      # ("latest" released binary): `homeboy release resolve` and the
      # `extension action --payload` passthrough are now released contracts.
      # extension-ref and action-ref are pinned to exact commits of released
      # tags so the Composer contract and release pipeline stay reproducible.
      - uses: Extra-Chill/homeboy-action@cad123d49bc1ef414d0ac802a436643294d3a45c # v2.20.3
        with:
          prepare-only: true
          extension: wordpress
          extension-ref: 7e4c3114604bd08a8507e2d1c5c1a3b2ef035575 # wordpress-v3.48.9
          component: static-site-importer

      - name: Run Homeboy dependency refresh action
        env:
          HOMEBOY_DRY_RUN: ${{ inputs.dry-run || 'false' }}
        run: bash scripts/release/refresh-blocks-engine.sh

      - name: Assert dry-run left manifests unchanged
        if: inputs.dry-run == true
        run: git diff --exit-code -- composer.json composer.lock

      - name: Commit refreshed pins
        if: inputs.dry-run != true
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.json composer.lock; then
            echo "No published Blocks Engine pin changed."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composer.json composer.lock
          # fix(deps) is deliberate, not chore(deps): Homeboy's release
          # planner ignores chore commits for the version-bump floor, so a
          # solo chore-only refresh would never be releasable. This must
          # bump so a dependency refresh with no other SSI change still
          # ships (operator intent: no manual release ceremony).
          git commit -m "fix(deps): refresh Blocks Engine pins to latest release"
          git push origin HEAD:main

      - name: Resolve prepared source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Issue #1808. Blocking consumer-contract gate: build the html-site-import
  # runtime-profile zip from the prepared commit and prove it imports a real
  # fixture through `wp static-site-importer import --request=` (plan, then
  # apply, request-bundle zip source), asserting the
  # static-site-importer/import-cli-receipt/v1 receipts. The gate runs on a
  # real PHP CLI so the fresh-runtime WP-CLI re-exec and compile worker fanout
  # actually execute; php-wasm cannot run that path (documented in
  # tools/run-release-import-gate.mjs and printed in the job output).
  release-import-gate:
    name: Release import gate (html-site-import zip)
    needs: refresh
    if: needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_VERSION: '20.19.4'
      PHP_VERSION: '8.2.33'
      HOMEBOY_VERSION: v0.298.1
      HOMEBOY_SHA256: 543a1eb7348a9dcde3bee671dbbeaabb9486781d350792bed8a77424fdad60d5
      HOMEBOY_EXTENSIONS_REF: 615fe3632d0cd30e9a70d5aea82be80460d733d5
    steps:
      - name: Checkout prepared source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.refresh.outputs.source-sha }}
          path: static-site-importer

      # The packaging path extracts the transformer from a Blocks Engine
      # checkout; the tag must match the pin committed in composer.lock.
      - name: Resolve pinned Blocks Engine transformer tag
        id: blocks-engine
        working-directory: static-site-importer
        run: |
          TRANSFORMER_VERSION=$(node -e 'const fs=require("node:fs");const lock=JSON.parse(fs.readFileSync("composer.lock","utf8")); const pin=lock.packages.find((entry)=>entry.name==="automattic/blocks-engine-php-transformer"); if(!pin)process.exit(1); console.log(pin.version.replace(/^v/,""))')
          echo "ref=php-transformer-v${TRANSFORMER_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Blocks Engine
        uses: actions/checkout@v6
        with:
          repository: Automattic/blocks-engine
          ref: ${{ steps.blocks-engine.outputs.ref }}
          path: blocks-engine

      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pinned PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Install pinned Homeboy
        run: |
          mkdir -p "$RUNNER_TEMP/homeboy"
          curl --fail --location --retry 3 --retry-all-errors --output "$RUNNER_TEMP/homeboy.tar.xz" "https://github.com/Extra-Chill/homeboy/releases/download/${HOMEBOY_VERSION}/homeboy-x86_64-unknown-linux-gnu.tar.xz"
          echo "${HOMEBOY_SHA256}  $RUNNER_TEMP/homeboy.tar.xz" | sha256sum --check --status
          tar --extract --xz --file "$RUNNER_TEMP/homeboy.tar.xz" --directory "$RUNNER_TEMP/homeboy" --strip-components=1
          chmod +x "$RUNNER_TEMP/homeboy/homeboy"
          echo "$RUNNER_TEMP/homeboy" >> "$GITHUB_PATH"

      # `homeboy review build` refuses to package a component whose declared
      # extension is not installed; the packaging path needs it like CI lanes
      # that run Homeboy against this component do.
      - name: Install pinned Homeboy wordpress extension
        run: |
          homeboy extension install https://github.com/Extra-Chill/homeboy-extensions --id wordpress --ref "$HOMEBOY_EXTENSIONS_REF"

      - name: Build the html-site-import runtime profile zip
        working-directory: static-site-importer
        env:
          BLOCKS_ENGINE_REF: ${{ steps.blocks-engine.outputs.ref }}
        run: |
          node tools/build-dev-package.mjs \
            --runtime-profile html-site-import \
            --blocks-engine-path "$GITHUB_WORKSPACE/blocks-engine" \
            --blocks-engine-ref "$BLOCKS_ENGINE_REF" \
            --output-dir "$RUNNER_TEMP/gate-package"

      - name: Assert the zip provenance matches the prepared commit
        working-directory: static-site-importer
        env:
          PREPARED_SHA: ${{ needs.refresh.outputs.source-sha }}
        run: |
          node -e 'const fs=require("node:fs");const provenance=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const head=provenance.static_site_importer?.head;const profile=provenance.runtime_profile;if(head!==process.env.PREPARED_SHA){console.error("Provenance head "+head+" does not match prepared commit "+process.env.PREPARED_SHA);process.exit(1);}if(profile!=="html-site-import"){console.error("Provenance runtime_profile "+profile+" is not html-site-import");process.exit(1);}console.log("Provenance verified: head="+head+" profile="+profile);' "$RUNNER_TEMP"/gate-package/*.zip.json

      - name: Run the release import gate
        working-directory: static-site-importer
        run: |
          node tools/run-release-import-gate.mjs \
            --zip "$RUNNER_TEMP"/gate-package/*.zip \
            --output "$RUNNER_TEMP/gate-evidence"

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-import-gate-${{ needs.refresh.outputs.source-sha }}
          path: ${{ runner.temp }}/gate-evidence
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Release prepared SSI commit
    needs: [refresh, release-import-gate]
    if: needs.refresh.result == 'success' && needs.release-import-gate.result == 'success'
    # Pinned to an exact release tag, not the moving `v2` alias. `v2` currently
    # points at v2.18.0, which predates the `prepared-ref` input, and passing an
    # input a reusable workflow does not declare fails the run at startup with
    # no job log and no annotation. Tracked as Extra-Chill/homeboy-action#497.
    uses: Extra-Chill/homeboy-action/.github/workflows/release.yml@v2.20.3
    with:
      prepared-ref: ${{ needs.refresh.outputs.source-sha }}
      release-branch: main
      dry-run: ${{ inputs.dry-run || false }}
      extension: wordpress
      extension-ref: 7e4c3114604bd08a8507e2d1c5c1a3b2ef035575 # wordpress-v3.48.9
      component: static-site-importer
      action-ref: cad123d49bc1ef414d0ac802a436643294d3a45c # v2.20.3
    secrets: inherit
