name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  editor-presentation-browser:
    name: Editor Presentation Browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: node --test tests/editor-presentation-browser.test.mjs tests/form-layout-rendered.test.mjs tools/run-existing-runtime-review.test.mjs

  homeboy-lint:
    name: Homeboy Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Extra-Chill/homeboy-action@5e7ee62f19455be58d6b05a16333ceb389eb385c  # v2.11.10
        with:
          commands: review lint
          args: --extension wordpress
          differential-gating: true
          php-version: '8.2'
          node-version: '24'

  homeboy-test:
    name: Homeboy Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Extra-Chill/homeboy-action@5e7ee62f19455be58d6b05a16333ceb389eb385c  # v2.11.10
        with:
          commands: review test
          args: --extension wordpress
          scope: full
          differential-gating: true
          php-version: ${{ matrix.php-version }}
          node-version: '24'
