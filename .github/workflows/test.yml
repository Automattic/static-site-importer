name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  editor-presentation-browser:
    name: Editor Presentation Browser
    runs-on: ubuntu-latest
    # Matches package-lock.json; browser system libraries are part of this runtime.
    container: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: bash tools/prepare-wordpress-core-fixture.sh
      - run: node --test tests/editor-presentation-browser.test.mjs tests/form-layout-rendered.test.mjs tests/form-role-box-parity.test.mjs tools/run-existing-runtime-review.test.mjs

  homeboy-lint:
    name: Homeboy Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Extra-Chill/homeboy-action@4e5564566f21d0a95dd0ce5e6e0b910c8d753925  # v2.20.9
        with:
          commands: review lint
          args: --extension wordpress
          differential-gating: true
          php-version: '8.2'
          node-version: '24'

  homeboy-test:
    name: Homeboy Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    env:
      WORDPRESS_VERSION: '7.1.2'
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Provision core HTML API for content-policy regressions
        run: curl -fsSL "https://wordpress.org/wordpress-${WORDPRESS_VERSION}.tar.gz" | tar -xz -C "$RUNNER_TEMP"

      - uses: Extra-Chill/homeboy-action@4e5564566f21d0a95dd0ce5e6e0b910c8d753925  # v2.20.9
        env:
          STATIC_SITE_IMPORTER_WP_ROOT: ${{ runner.temp }}/wordpress
        with:
          commands: review test
          args: --extension wordpress
          scope: full
          differential-gating: true
          php-version: ${{ matrix.php-version }}
          node-version: '24'
