<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Actionless radio form</title>
<style>.choice{margin:8px 0}.btn{padding:6px 12px}</style>
</head>
<body>
<main>
<h1>Survey</h1>
<form class="survey" data-id="1">
<div>
<h3>Do you read the newsletter?</h3>
<div class="choice"><label><input type="radio" name="question" value="0" checked> Yes, very often</label></div>
<div class="choice"><label><input type="radio" name="question" value="1"> Not this time</label></div>
</div>
<div><input type="submit" class="btn" value="Submit"><input type="button" class="btn" value="Result" disabled></div>
</form>
</main>
</body>
</html>
