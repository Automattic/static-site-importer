<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote form</title>
<style>*,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}body{margin:0;font-family:sans-serif;color:#0f172a}
.wrap{max-width:560px;margin:48px auto;padding:24px}.band{background:#2563eb;color:#fff;padding:24px}
label{display:block;font-size:.875rem;margin-bottom:4px}input,textarea{display:block;width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:8px 12px;font:inherit}
.space-y-4>*+*{margin-top:1rem}.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;height:2.25rem;padding:0 1rem;border-radius:6px;font:inherit;cursor:pointer}
.bg-blue-600{--tw-bg-opacity:1;background-color:rgb(37 99 235/var(--tw-bg-opacity,1))}.hover\:bg-blue-700:hover{--tw-bg-opacity:1;background-color:rgb(29 78 216/var(--tw-bg-opacity,1))}.text-white{color:#fff}</style></head>
<body><div class="band"><h1>Request a quote</h1></div><div class="wrap"><form class="space-y-4" action="#" method="post">
<div><label for="n">Your name *</label><input id="n" name="name" required></div>
<div><label for="e">Email *</label><input id="e" name="email" type="email" required></div>
<div><label for="m">Tell me about your project *</label><textarea id="m" name="message" rows="4" required></textarea></div>
<button type="submit" class="btn bg-blue-600 hover:bg-blue-700 text-white">Send my request</button></form></div></body></html>
