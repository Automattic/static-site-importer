<style>
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid .first{grid-row:1;width:200px}
.grid .last{grid-row:1;width:400px}
.grid .wide{grid-row:2;grid-column:1 / -1}
label{display:block;margin-bottom:4px}
input{width:100%;padding:8px 10px;border:1px solid #999}
</style>
<form class="grid">
<div class="first"><label for="given">Given name</label><input id="given" name="given" type="text"></div>
<div class="last"><label for="family">Family name</label><input id="family" name="family" type="text"></div>
<div class="wide"><label for="email">Email</label><input id="email" name="email" type="email"></div>
<button type="submit">Send</button>
</form>
