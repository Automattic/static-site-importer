<style>
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
.form-grid .full{grid-column:span 2}
.field label{display:block;margin-bottom:6px;font-size:14px}
.field input,.field textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:4px}
</style>
<form class="form-grid">
<div class="field"><label for="first">First name</label><input id="first" name="first" type="text"></div>
<div class="field"><label for="last">Last name</label><input id="last" name="last" type="text"></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email"></div>
<div class="field"><label for="company">Company</label><input id="company" name="company" type="text"></div>
<div class="field full"><label for="note">Note</label><textarea id="note" name="note" rows="3"></textarea></div>
<button type="submit">Submit</button>
</form>
