<style>
@layer theme,base,utilities;
@layer theme{:root{--spacing:.25rem}}
@layer base{*,::before,::after{box-sizing:border-box;border:0 solid}input,textarea{font:inherit;color:inherit}}
@layer utilities{.grid{display:grid}.gap-2{gap:calc(var(--spacing) * 2)}.gap-5{gap:calc(var(--spacing) * 5)}.w-full{width:100%}.h-11{height:2.75rem}.border{border-width:1px}.border-input{border-color:#3f3f46}.rounded-md{border-radius:.375rem}.px-3{padding-inline:calc(var(--spacing) * 3)}.py-2{padding-block:calc(var(--spacing) * 2)}.text-sm{font-size:.875rem;line-height:1.25rem}}
</style>
<main>
<form class="grid gap-5">
<div class="grid gap-2"><label for="name" class="text-sm">Name</label><input id="name" name="name" type="text" class="h-11 w-full border border-input rounded-md px-3 py-2"></div>
<div class="grid gap-2"><label for="email" class="text-sm">Email</label><input id="email" name="email" type="email" class="h-11 w-full border border-input rounded-md px-3 py-2"></div>
<div class="grid gap-2"><label for="message" class="text-sm">Message</label><textarea id="message" name="message" rows="4" class="w-full border border-input rounded-md px-3 py-2"></textarea></div>
<button type="submit">Send</button>
</form>
</main>
