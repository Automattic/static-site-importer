<style>
.group{margin-bottom:16px}
.option{display:flex;align-items:center;gap:8px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;margin:0}
</style>
<form>
<div class="group"><span>Interests</span>
<label class="option"><input type="checkbox" name="interests" value="news"> News</label>
<label class="option"><input type="checkbox" name="interests" value="events"> Events</label>
</div>
<div class="group"><span>Frequency</span>
<label class="option"><input type="radio" name="frequency" value="weekly"> Weekly</label>
<label class="option"><input type="radio" name="frequency" value="monthly"> Monthly</label>
</div>
<label class="option"><input type="checkbox" name="consent" required> I agree to the terms</label>
<button type="submit">Subscribe</button>
</form>
