<style>
.contact-row{display:flex;flex-direction:row;justify-content:space-between;align-items:center;width:100%}
.contact-cell{width:50%;margin-right:5px;margin-left:5px}
@media screen and (max-width:479px){.contact-row{flex-direction:column}.contact-cell{width:100%;margin-left:0;margin-right:0}}
</style>
<form>
<div class="contact-row">
<div class="contact-cell"><div class="field"><label for="first">First name</label><input id="first" name="first" type="text"></div></div>
<div class="contact-cell"><div class="field"><label for="last">Last name</label><input id="last" name="last" type="text"></div></div>
</div>
<div class="contact-row">
<div class="contact-cell"><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div></div>
<div class="contact-cell"><div class="field"><label for="postal">Postal code</label><input id="postal" name="postal" type="text"></div></div>
</div>
<button type="submit">Send</button>
</form>
