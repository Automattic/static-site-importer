<style>
*{box-sizing:border-box}
.cf-row{display:flex;flex-wrap:wrap}
.cf-row .box{margin-right:20px}
.cf-row .note{display:block;width:100%;margin-right:20px;margin-bottom:1em;padding:.5em 1em;border:1px solid #999}
.send{display:grid}
input,textarea{display:block;width:100%;padding:.5em 1em;border:1px solid #999}
</style>
<form class="cf">
<div class="cf-row">
<div style="width:50%"><div class="box"><input name="name" type="text" placeholder="Name" required></div></div>
<div style="width:50%"><div class="box"><input name="email" type="email" placeholder="Email" required></div></div>
<div style="width:100%"><div class="note"><textarea name="message" rows="3" placeholder="Message" required></textarea></div></div>
</div>
<div class="send"><button type="submit">Send</button></div>
</form>
