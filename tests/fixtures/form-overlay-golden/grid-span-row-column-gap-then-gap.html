<style>
.fields{display:grid;grid-template-columns:repeat(2,1fr);column-gap:10px;gap:40px}
.start{grid-column:1 / span 1}
.end{grid-column:2 / span 1}
.full{grid-column:1 / span 2}
label{display:block}
input,textarea{width:100%}
</style>
<form><div class="fields">
<div class="start"><label for="first">First name</label><input id="first" name="first" type="text"></div>
<div class="end"><label for="last">Last name</label><input id="last" name="last" type="text"></div>
<div class="full"><label for="message">Message</label><textarea id="message" name="message"></textarea></div>
</div><button type="submit">Send</button></form>
