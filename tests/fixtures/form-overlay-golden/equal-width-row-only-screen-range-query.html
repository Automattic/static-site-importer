<style>
.pair{display:grid;grid-template-columns:1fr;gap:16px}
@media only screen and (width>=768px){.pair{grid-template-columns:repeat(2,1fr)}}
label{display:block}
input{width:100%}
</style>
<form><div class="pair">
<div><label for="city">City</label><input id="city" name="city" type="text"></div>
<div><label for="zip">Postal code</label><input id="zip" name="zip" type="text"></div>
</div><label for="email">Email</label><input id="email" name="email" type="email"><button type="submit">Send</button></form>
