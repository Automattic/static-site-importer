<style>
.card{background:#f4f4f5;border:1px solid #e4e4e7;border-radius:12px;padding:32px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card-title{font-size:24px;line-height:32px;font-weight:700;margin:0 0 8px;color:#18181b}
.card-intro{font-size:15px;line-height:24px;color:#52525b;margin:0 0 20px}
.card .field{margin-bottom:16px}
.card label{display:block;font-size:14px;margin-bottom:6px}
.card input{width:100%;padding:10px 12px;border:1px solid #d4d4d8;border-radius:8px;background:#fff}
.card-note{font-size:12px;color:#71717a;padding-top:8px}
</style>
<section class="card">
<form>
<h2 class="card-title">Get in touch</h2>
<p class="card-intro">Leave your details and we will reply soon.</p>
<div class="field"><label for="name">Name</label><input id="name" name="name" type="text"></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email"></div>
<button type="submit">Send</button>
<p class="card-note">We never share your address.</p>
</form>
</section>
