<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Message form</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px sans-serif}
form{display:flex;flex-direction:column;gap:22px;width:320px}
textarea{display:block;height:80px;width:100%;margin:0}
.send{display:inline-flex;align-items:center;justify-content:center;height:2.25rem;padding:1.5rem 1rem;border:0;font:inherit}
@media(max-width:480px){.send{height:2rem;padding-block:1.75rem}}
p{margin:0}
</style></head><body><form action="#" method="post">
<div><label for="message">Message</label><textarea id="message" name="message"></textarea></div>
<button class="send" type="submit">Send message</button>
<p>No obligation</p>
</form></body></html>
